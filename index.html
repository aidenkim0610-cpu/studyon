<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDYON | AI 맞춤 학습</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fc;color:#202b40;font-family:Arial,sans-serif}
header{background:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8edf5}
.logo{font-size:25px;font-weight:800;color:#3268e8}
nav{color:#667085;font-size:14px}
main{max-width:1050px;margin:65px auto;padding:20px}
.hero{background:#245ee8;color:white;padding:55px 40px;border-radius:22px}
.hero h1{font-size:38px;margin:0 0 15px}
.hero p{line-height:1.8}
button{border:0;border-radius:10px;padding:14px 22px;background:white;color:#245ee8;font-weight:bold;cursor:pointer}
.section{margin-top:45px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:white;padding:25px;border-radius:16px;border:1px solid #e9edf5}
.card h3{margin-top:0}
.card p{color:#667085;line-height:1.6}
footer{text-align:center;color:#98a2b3;padding:40px}
@media(max-width:650px){.cards{grid-template-columns:1fr}.hero h1{font-size:28px}main{margin:25px auto}.hero{padding:35px 24px}}
</style>
</head>
<body>
<header>
<div class="logo">STUDYON</div>
<nav>AI PERSONAL LEARNING</nav>
</header>
<main>
<section class="hero">
<h1>나에게 맞는 공부,<br>AI가 찾아주다.</h1>
<p>시험지를 업로드하면 AI가 학습 수준을 분석하고<br>나에게 필요한 맞춤형 문제를 만들어 줍니다.</p>
<button onclick="document.getElementById('start').scrollIntoView({behavior:'smooth'})">학습 시작하기 →</button>
</section>
<section class="section" id="start">
<h2>나만의 AI 학습 시스템</h2>
<div class="cards">
<div class="card"><h3>📄 시험지 분석</h3><p>시험지 사진과 PDF를 업로드하여 문제를 분석합니다.</p></div>
<div class="card"><h3>📊 취약점 분석</h3><p>과목과 단원별로 부족한 학습 유형을 파악합니다.</p></div>
<div class="card"><h3>✨ 맞춤형 문제</h3><p>분석 결과를 바탕으로 새로운 연습 문제를 생성합니다.</p></div>
</div>
</section>
</main>
<footer>STUDYON · AI PERSONAL LEARNING PLATFORM</footer>
</body>
</html>
