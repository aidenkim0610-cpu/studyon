
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUDYON | AI 맞춤 학습</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#202b3c;font-family:Arial,sans-serif}
header{background:white;padding:20px 7%;border-bottom:1px solid #eee}
.logo{font-size:25px;font-weight:bold;color:#2864e8}
main{max-width:850px;margin:40px auto;padding:20px}
.hero{text-align:center;margin-bottom:30px}
.panel{background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0000000a}
label{display:block;font-weight:bold;margin:18px 0 8px}
select,input[type=text]{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:8px;font-size:15px}
.upload{border:2px dashed #8eafea;background:#f6f9ff;padding:30px 15px;text-align:center;border-radius:13px;margin-top:10px}
.upload button{background:#2864e8;color:white;border:0;border-radius:8px;padding:13px 20px;font-size:15px;cursor:pointer}
.hint{font-size:13px;color:#78869a}
.file-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f1f5fa;padding:12px;margin-top:8px;border-radius:8px}
.file-name{overflow-wrap:anywhere;font-size:14px}
.remove{border:0;background:#ffe5e5;color:#c33;padding:8px 12px;border-radius:6px;cursor:pointer;flex-shrink:0}
.primary{width:100%;padding:16px;background:#2864e8;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;margin-top:22px;cursor:pointer}
#result{display:none;background:#edf4ff;padding:16px;border-radius:10px;margin-top:18px;line-height:1.7}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.feature{background:white;padding:18px;border-radius:12px;text-align:center}
@media(max-width:600px){.features{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">STUDYON</div></header>

<main>
<section class="hero">
<h1>나만의 AI 학습 파트너</h1>
<p>시험지를 업로드하고 나에게 맞는 학습 방향을 찾아보자.</p>
</section>

<section class="panel">
<h2>시험지 업로드</h2>

<label for="grade">학년</label>
<select id="grade">
<option value="">학년 선택</option>
<option>초등학교 6학년</option>
<option>중학교 1학년</option>
<option>중학교 2학년</option>
<option>중학교 3학년</option>
<option>고등학교 1학년</option>
<option>고등학교 2학년</option>
<option>고등학교 3학년</option>
</select>

<label for="subject">과목</label>
<select id="subject">
<option value="">과목 선택</option>
<option>국어</option><option>수학</option>
<option>영어</option><option>과학</option>
<option>사회</option><option>역사</option>
</select>

<label for="scope">시험 범위 (선택)</label>
<input type="text" id="scope" placeholder="예: 2단원, 일차방정식">

<label>시험지 파일</label>
<div class="upload">
<p style="font-size:35px;margin:0">📁</p>
<strong>사진과 PDF를 여러 개 추가할 수 있어!</strong>
<p class="hint">JPG · PNG · PDF / 파일당 최대 15MB</p>
<button type="button" id="addFiles">파일 추가하기</button>
<input type="file" id="fileInput" accept="image/jpeg,image/png,application/pdf,.jpg,.jpeg,.png,.pdf" multiple hidden>
</div>

<div id="fileList"></div>

<button type="button" id="clearFiles" class="remove" style="margin-top:12px">전체 삭제</button>

<button type="button" id="analyzeBtn" class="primary">AI 학습 분석 시작</button>
<div id="result"></div>
</section>

<section class="features">
<div class="feature"><h3>📊 취약점 분석</h3><p>부족한 학습 영역 파악</p></div>
<div class="feature"><h3>📝 맞춤 문제</h3><p>나에게 맞는 문제 생성</p></div>
<div class="feature"><h3>📈 학습 기록</h3><p>학습 과정 관리</p></div>
</section>
</main>

<script>
const input=document.getElementById("fileInput");
const addButton=document.getElementById("addFiles");
const list=document.getElementById("fileList");
const result=document.getElementById("result");

let files=[];

addButton.addEventListener("click",()=>{
  input.click();
});

input.addEventListener("change",(event)=>{
  const incoming=Array.from(event.target.files);
  const allowed=["image/jpeg","image/png","application/pdf"];
  let added=0;

  incoming.forEach(file=>{
    if(!allowed.includes(file.type)){
      alert(file.name+" : 지원하지 않는 파일 형식이야.");
      return;
    }
    if(file.size>15*1024*1024){
      alert(file.name+" : 15MB를 초과했어.");
      return;
    }
    files.push(file);
    added++;
  });

  input.value="";
  renderFiles();
  if(added>0){
    result.style.display="none";
  }
});

function renderFiles(){
  list.innerHTML="";

  const heading=document.createElement("p");
  heading.textContent="선택된 파일: "+files.length+"개";
  list.appendChild(heading);

  files.forEach((file,index)=>{
    const row=document.createElement("div");
    row.className="file-item";

    const name=document.createElement("span");
    name.className="file-name";
    name.textContent=(file.type==="application/pdf"?"📕 ":"🖼️ ")+file.name;

    const remove=document.createElement("button");
    remove.className="remove";
    remove.textContent="삭제";
    remove.type="button";
    remove.onclick=()=>{
      files.splice(index,1);
      renderFiles();
    };

    row.append(name,remove);
    list.appendChild(row);
  });
}

document.getElementById("clearFiles").onclick=()=>{
  files=[];
  input.value="";
  renderFiles();
  result.style.display="none";
};

document.getElementById("analyzeBtn").onclick=()=>{
  const grade=document.getElementById("grade").value;
  const subject=document.getElementById("subject").value;

  if(!grade||!subject){
    alert("학년과 과목을 선택해 줘.");
    return;
  }

  if(files.length===0){
    alert("시험지 파일을 추가해 줘.");
    return;
  }

  result.style.display="block";
  result.textContent="파일 "+files.length+"개가 선택됐어. 실제 AI 분석 서버는 아직 연결되지 않았어.";
};

renderFiles();
</script>
</body>
</html>
